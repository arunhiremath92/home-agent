services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-agent}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  agent-ollama:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      target: desktop
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-agent}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a random secret of at least 32 characters}
      AGENT_API_AUDIENCE: ${AGENT_API_AUDIENCE:-home-agent-api}
      AGENT_HOUSEHOLD_ID: ${AGENT_HOUSEHOLD_ID:?Set AGENT_HOUSEHOLD_ID to this deployment's household ID}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:?Set GOOGLE_MAPS_API_KEY}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-${OPEN_API_KEY:-}}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_SERVER_URL: ${MODEL_SERVER_URL:-http://127.0.0.1:11434/v1}
      HOME_LATITUDE: ${HOME_LATITUDE:-}
      HOME_LONGITUDE: ${HOME_LONGITUDE:-}
    ports:
      - "${AGENT_SERVER_PORT:-8080}:8080"
    volumes:
      - ollama-models:/models
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "4", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30m

volumes:
  postgres-data:
  ollama-models:
